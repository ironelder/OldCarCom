<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="sans-serif">
  <rect width="460" height="300" fill="#FAF7EC"/>
  <text x="230" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#10532F">카뷰레터 조정 포인트 (개념도)</text>

  <!-- 카뷰레터 바디 -->
  <rect x="150" y="90" width="160" height="120" rx="10" fill="#EAF3EC" stroke="#10532F" stroke-width="2"/>
  <rect x="200" y="60" width="60" height="30" rx="4" fill="#EAF3EC" stroke="#10532F" stroke-width="2"/>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#5A6B5A">에어혼</text>
  <rect x="196" y="210" width="68" height="24" fill="#EAF3EC" stroke="#10532F" stroke-width="2"/>
  <text x="230" y="227" text-anchor="middle" font-size="11" fill="#5A6B5A">인테이크</text>

  <!-- 공회전 속도 스크류 -->
  <circle cx="330" cy="150" r="7" fill="#C8961E"/>
  <line x1="310" y1="150" x2="323" y2="150" stroke="#C8961E" stroke-width="3"/>
  <text x="342" y="145" font-size="13" fill="#20301F">공회전 속도(RPM) 스크류</text>
  <text x="342" y="162" font-size="11" fill="#5A6B5A">→ 워밍업 후 규정 rpm</text>

  <!-- 혼합비 스크류 -->
  <circle cx="130" cy="175" r="7" fill="#C8961E"/>
  <line x1="137" y1="175" x2="150" y2="175" stroke="#C8961E" stroke-width="3"/>
  <text x="14" y="200" font-size="13" fill="#20301F">혼합비(믹스처) 스크류</text>
  <text x="14" y="217" font-size="11" fill="#5A6B5A">→ 최고 rpm/안정 지점</text>

  <text x="230" y="270" text-anchor="middle" font-size="12" fill="#5A6B5A">순서: 워밍업 → 공회전 속도 세팅 → 혼합비로 최고·안정 rpm → 재조정</text>
  <text x="230" y="288" text-anchor="middle" font-size="11" fill="#5A6B5A">※ 카뷰레터 종류(솔렉스/베버/홀리)별 스크류 위치 상이</text>
</svg>
