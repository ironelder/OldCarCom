<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="sans-serif">
  <rect width="480" height="320" fill="#FAF7EC"/>
  <text x="240" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#10532F">타이밍 마크 정렬 (개념도)</text>

  <!-- 캠 스프로킷 -->
  <circle cx="150" cy="120" r="55" fill="none" stroke="#10532F" stroke-width="6"/>
  <circle cx="150" cy="120" r="8" fill="#10532F"/>
  <line x1="150" y1="120" x2="150" y2="60" stroke="#C8961E" stroke-width="4"/>
  <polygon points="150,52 145,64 155,64" fill="#C8961E"/>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#20301F">캠 스프로킷</text>
  <text x="150" y="217" text-anchor="middle" font-size="12" fill="#5A6B5A">마크 → 상방</text>

  <!-- 크랭크 스프로킷 -->
  <circle cx="340" cy="200" r="40" fill="none" stroke="#10532F" stroke-width="6"/>
  <circle cx="340" cy="200" r="7" fill="#10532F"/>
  <line x1="340" y1="200" x2="340" y2="240" stroke="#C8961E" stroke-width="4"/>
  <polygon points="340,248 335,236 345,236" fill="#C8961E"/>
  <text x="340" y="278" text-anchor="middle" font-size="14" fill="#20301F">크랭크 스프로킷</text>
  <text x="340" y="295" text-anchor="middle" font-size="12" fill="#5A6B5A">마크 ↔ 블록 표식 일치</text>

  <!-- 벨트/체인 경로 -->
  <path d="M150,65 Q250,60 300,175" fill="none" stroke="#20301F" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="255" y="120" font-size="12" fill="#5A6B5A">벨트/체인</text>

  <text x="240" y="312" text-anchor="middle" font-size="12" fill="#5A6B5A">1번 실린더 압축상사점(TDC)에서 캠·크랭크 마크를 각 표식에 정렬 후 장착</text>
</svg>
