<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif">
  <rect width="480" height="300" fill="#FAF7EC"/>
  <text x="240" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#10532F">냉각수 순환 흐름 (개념도)</text>

  <g stroke="#10532F" stroke-width="2" fill="#EAF3EC">
    <rect x="40" y="70" width="120" height="60" rx="8"/>
    <rect x="320" y="70" width="120" height="60" rx="8"/>
    <rect x="320" y="200" width="120" height="60" rx="8"/>
    <rect x="40" y="200" width="120" height="60" rx="8"/>
  </g>
  <g font-size="14" fill="#20301F" text-anchor="middle">
    <text x="100" y="105">라디에이터</text>
    <text x="380" y="98">엔진 블록</text>
    <text x="380" y="118" font-size="11" fill="#5A6B5A">(발열)</text>
    <text x="380" y="235">서모스탯</text>
    <text x="100" y="228">워터펌프</text>
    <text x="100" y="248" font-size="11" fill="#5A6B5A">(순환)</text>
  </g>

  <!-- 화살표 흐름: 워터펌프→블록→서모스탯→라디에이터→워터펌프 -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C8961E"/>
    </marker>
  </defs>
  <g stroke="#C8961E" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="160" y1="230" x2="318" y2="230"/>
    <line x1="380" y1="200" x2="380" y2="132"/>
    <line x1="320" y1="100" x2="162" y2="100"/>
    <line x1="100" y1="130" x2="100" y2="198"/>
  </g>
  <text x="240" y="215" text-anchor="middle" font-size="11" fill="#5A6B5A">냉간 시 서모스탯 닫힘→블록 내 순환, 온도 도달 시 열림→라디에이터로</text>
  <text x="240" y="286" text-anchor="middle" font-size="12" fill="#5A6B5A">점검: 워터펌프 누수·베어링, 서모스탯 고착, 라디에이터 막힘, 호스 경화</text>
</svg>
